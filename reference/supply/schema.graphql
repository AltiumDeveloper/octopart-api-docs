# Octopart API — Supply schema slice (~8076 tokens)
# Not a complete schema: types from other contexts are referenced, not defined.
# Full schema for code generation: https://altiumdeveloper.github.io/octopart-api-docs/schema.graphql
# Referenced from other contexts:
#   DateTime → Common: https://altiumdeveloper.github.io/octopart-api-docs/reference/common/schema.graphql
#   Map → Common: https://altiumdeveloper.github.io/octopart-api-docs/reference/common/schema.graphql

type Query {
  "Get all attributes"
  supAttributes: [SupAttribute!]!
  "Get manufacturer companies"
  supManufacturers(
    "list of company IDs.  Omit to fetch all manufacturers."
    ids: [String!]
    "list of URL slugs for /manufacturers paths"
    slugs: [String!]
    "Include temporarily suspended manufacturers in results. Intended for manufacturer taxonomy pages."
    includeSuspended: Boolean! = false
  ): [SupCompany!]!
  "Get seller companies (distributors)"
  supSellers(
    "list of company IDs.  Omit to fetch all sellers."
    ids: [String!]
    "Include only companies that support custom pricing."
    customPricingOnly: Boolean! = false
    "Include temporarily suspended distributors in results. Intended for distributor taxonomy pages."
    includeSuspended: Boolean! = false
    "list of URL slugs for /distributors paths"
    slugs: [String!]
  ): [SupCompany!]!
  "Get categories"
  supCategories(
    "list of category IDs. Omit to fetch all categories. Where id can be either an Octopart internal id or an Altium Global Resource ID (GRID)."
    ids: [String!]
    "list of SEO page paths for categories to include."
    paths: [String!]
    "Root of categories to include, defaults to ElectronicParts."
    root: SupCategoryRoot! = ElectronicParts
  ): [SupCategory!]!
  "Get a single category by id. Where id can be either an Octopart internal id or an Altium Global Resource ID (GRID)."
  supCategoryById(id: ID!): SupCategory
  "Get a list of categories by ids. Where id can be either an Octopart internal id or an Altium Global Resource ID (GRID)."
  supCategoriesByIds(ids: [ID!]!): [SupCategory]!
  "Get parts by ID."
  supParts(
    "list of part IDs. APIv3 UIDs are also supported."
    ids: [String!]!
    "user's country"
    country: String! = "US"
    "user's currency"
    currency: String! = "USD"
    "fetch latest pricing and stock data from distributor API. Company.isDistributorApi indicates if a distributor supports this feature."
    distributorApi: Boolean
    "how long to wait for distributor API to respond as a duration string (e.g. `3s` or `500ms`) up to a max 10s"
    distributorApiTimeout: String! = "3s"
    """
    if needed, pass along credentials for API integrations
    
    Requires plan tier: `ENTERPRISE`.
    """
    customPricingCredentials: [SupApiCredentials!]
  ): [SupPart]!
  """
  Attempt to complete a partial query string.  Used for autosuggest / typeahead text inputs.
  
  Requires plan tier: `ENTERPRISE`.
  """
  supSuggest(
    """
    partial query string
    
    Constraint: `max=1000`.
    """
    q: String!
    "categoryId to scope suggestions to"
    categoryId: String
    "only return part number suggestions"
    partNumbersOnly: Boolean
  ): [SupSuggestion!]!
  "Search parts, including filters, pagination, aggregation, sorting"
  supSearch(
    """
    the query to search
    
    Constraint: `max=2000`.
    """
    q: String
    "user's country"
    country: String! = "US"
    "user's currency"
    currency: String! = "USD"
    "offset in the result set"
    start: Int
    "page size of results"
    limit: Int
    "field to sort by.  See [sort values](https://octopart.com/api/v4/values#sort)"
    sort: String
    "direction of sort: `asc` or `desc`"
    sortDir: SupSortDirection
    "filter to remove parts with no stocking distributors"
    inStockOnly: Boolean
    "a key: value map of filters. See [filter values](https://octopart.com/api/v4/values#attributes)"
    filters: Map
    "fetch latest pricing and stock data from distributor API. Company.isDistributorApi indicates if a distributor supports this feature."
    distributorApi: Boolean
    "how long to wait for distributor API to respond as a duration string (e.g. `3s` or `500ms`)"
    distributorApiTimeout: String! = "3s"
    """
    if needed, pass along credentials for API integrations
    
    Requires plan tier: `ENTERPRISE`.
    """
    customPricingCredentials: [SupApiCredentials!]
    "Specifying a ranking method."
    rankingMethod: SupSearchRankingMethod! = DEFAULT
  ): SupPartResultSet!
  "Search parts by mpn only, including filters, pagination, aggregation, sorting"
  supSearchMpn(
    """
    the query to search on mpn
    
    Constraint: `max=2000`.
    """
    q: String
    "user's country"
    country: String! = "US"
    "user's currency"
    currency: String! = "USD"
    "offset in the result set"
    start: Int
    "page size of results"
    limit: Int
    "field to sort by.  See [sort values](https://octopart.com/api/v4/values#sort)"
    sort: String
    "direction of sort: `asc` or `desc`"
    sortDir: SupSortDirection
    "filter to remove parts with no stocking distributors"
    inStockOnly: Boolean
    "a key: value map of filters. See [filter values](https://octopart.com/api/v4/values#attributes)"
    filters: Map
    "fetch latest pricing and stock data from distributor API. Company.isDistributorApi indicates if a distributor supports this feature."
    distributorApi: Boolean
    "how long to wait for distributor API to respond as a duration string (e.g. `3s` or `500ms`)"
    distributorApiTimeout: String! = "3s"
    """
    if needed, pass along credentials for API integrations
    
    Requires plan tier: `ENTERPRISE`.
    """
    customPricingCredentials: [SupApiCredentials!]
    "Specifying a ranking method."
    rankingMethod: SupSearchRankingMethod! = DEFAULT
  ): SupPartResultSet!
  """
  Suggest alternate queries when no results are found.
  
  Requires plan tier: `ENTERPRISE`.
  """
  supSearchCorrection(
    """Constraint: `max=2000`."""
    q: String!
    filters: Map
    "Fixed filters that should always be applied i.e. don't suggest corrections that would drop these filters."
    fixedFilters: Map
  ): [SupSearchCorrection!]!
  """
  Suggest an alternate `q` when no results are found. This treats the query as an MPN search so will return suggestions based on MPNs.
  
  Requires plan tier: `ENTERPRISE`.
  """
  supSpellingCorrection(
    """
    query string to correct
    
    Constraint: `max=2000`.
    """
    q: String!
  ): [SupSpellingCorrection!]!
  "Match multiple manufacturer + mpn pairs at once.  Useful for when you have a list of parts, as with a BOM (Bill of Materials)"
  supMultiMatch(
    "list of inputs to attempt to match"
    queries: [SupPartMatchQuery!]!
    "options when matching such as applying filters or only including authorized or in-stock parts"
    options: SupPartMatchOptions
    "user's country"
    country: String! = "US"
    "user's currency"
    currency: String! = "USD"
    "fetch latest pricing and stock data from distributor API. Company.isDistributorApi indicates if a distributor supports this feature."
    distributorApi: Boolean
    "how long to wait for distributor API to respond as a duration string (e.g. `3s` or `500ms`)"
    distributorApiTimeout: String! = "3s"
    """
    if needed, pass along credentials for API integrations
    
    Requires plan tier: `ENTERPRISE`.
    """
    customPricingCredentials: [SupApiCredentials!]
    "Specifying a ranking method."
    rankingMethod: SupSearchRankingMethod! = DEFAULT
  ): [SupPartMatch!]!
}

"Used to show the filters that are applied to current search."
type SupAppliedFilter {
  "shortname is the key in the filters Map.  Usually an attribute shortname, or `manufacturerId`, `distributorId`, etc."
  shortname: String!
  "human readable name to display in the UI"
  name: String!
  "values in the filter Map."
  values: [String!]!
  "human readable values to display in the UI"
  displayValues: [String!]!
  "The symbol of the units"
  unitsSymbol: String
}

"Defines an attribute like Capacitance or Resistance."
type SupAttribute {
  "Internal Octopart ID"
  id: ID!
  "display name"
  name: String!
  "use as key for `sort` or `filter` in part search"
  shortname: String!
  "use to group together similar attributes, e.g. Technical, Physical, Compliance"
  group: String!
  "The type of the value"
  valueType: String!
  "The short name of the units"
  unitsName: String!
  "The symbol of the units"
  unitsSymbol: String!
  "Shortened display name"
  shortDisplayname: String!
}

"Groups similar attributes together, as can be seen with column groups in specs view"
type SupAttributeGroup {
  "Name of group, e.g. Technical, Physical, Compliance"
  name: String!
  "Attributes in group"
  attributes: [SupAttribute!]!
}

"Information for use on /electronic-parts Category pages."
type SupBlurb {
  "Category name."
  name: String!
  "Path to /electronic-parts Category page."
  pathName: String!
  "Short description of Category."
  description: String!
  "Longer description of Category."
  content: String!
  "Description used in webpage metadata - SEO optimised"
  metaDescription: String!
  "Title used in webpage metadata - SEO optimised"
  metaTitle: String!
}

"cadAgg produces a CadBucket with the count of parts that have CAD Symbol + Footprint and 3D model"
type SupCadBucket {
  cadState: String!
  count: Int
}

"A Category exists in a Category tree.  Examples include Passive Components or Capacitors.  The `path` field is helpful to see where a category is in the tree."
type SupCategory {
  "Octopart internal id."
  id: ID!
  "ID of parent category."
  parentId: ID!
  "Display name"
  name: String!
  "List of all ancestor in category tree."
  ancestors: [SupCategory!]!
  "List of direct children in category tree."
  children: [SupCategory!]!
  "Slash separated path.  Can be used to visit URL for category page.  (e.g. `/electronic-parts/circuit-protection/esd-and-circuit-protection-ics`)"
  path: String!
  "List of Attributes deemed to be relevant to this category.  (e.g. Resistance for Resistor category).  Useful for showing contextual filters in UI."
  relevantAttributes: [SupAttribute!]!
  "Blurb for Category, used on /electronic-parts pages."
  blurb: SupBlurb
  "Number of parts in Category."
  numParts: Int!
}

"categoryAgg produces a CategoryBucket with category + counts"
type SupCategoryBucket {
  category: SupCategory!
  count: Int
}

"A company record represents a manufacturer or distributor, depending on context."
type SupCompany {
  "Octopart internal id"
  id: ID!
  "Display name of company"
  name: String!
  "Aliases of company"
  aliases: [String!]!
  "The country code for the display flag"
  displayFlag: String
  "Homepage URL of company"
  homepageUrl: String
  "Used for URLs like `/manufacturers/aimtec` or `/distributors/digi-key`"
  slug: String!
  "True if a manufacturer participates in Octopart's Verified Manufacturer program.  See [verified](https://octopart.com/verified) for more information."
  isVerified: Boolean!
  "True if a distributor is a broker.  See [authorized](https://octopart.com/authorized) for more information."
  isBroker: Boolean! @deprecated(reason: "use `PartSeller.is_broker` instead")
  "True if a distributor has an API integration with Octopart to provide latest pricing and stock data."
  isDistributorApi: Boolean!
  "True if Octocart is supported for this distributor"
  isOctocartSupported: Boolean!
  "True if the company is temporarily suspended and excluded from normal results."
  isSuspended: Boolean!
  "Custom Pricing details."
  customPricingDetails: SupCustomPricingDetails
}

"manufacturerAgg and distributorAgg produce a CompanyBucket with company + counts"
type SupCompanyBucket {
  company: SupCompany!
  count: Int
}

"A country's name, country code, and continent code."
type SupCountry {
  name: String!
  countryCode: String!
  continentCode: String!
}

type SupCustomPricingDetails {
